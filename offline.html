<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sin conexión — Gest Inventary</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Inter, sans-serif;
            background: #121E6C;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .card {
            background: rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            max-width: 360px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }
        p {
            font-size: 0.9rem;
            opacity: 0.75;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn {
            background: #EE424E;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.85rem 2rem;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        .logo {
            font-size: 1rem;
            font-weight: 800;
            margin-bottom: 2rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">Gest Inventary</div>
        <div class="icon">📡</div>
        <h1>Sin conexión</h1>
        <p>
            No hay conexión a internet. Tus datos locales
            están disponibles. Conéctate para sincronizar
            con la nube.
        </p>
        <button class="btn" onclick="window.location.reload()">
            Reintentar conexión
        </button>
    </div>
</body>
</html>
